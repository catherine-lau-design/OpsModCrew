<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prize Wheel - Ops Mod Crew Holiday Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "AC Nord Display"; src: url("fonts/ACNordDisplay-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }

  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F4F0; font-family: 'Open Sans', sans-serif; color: #1E1E1E; }
  .page { padding: 24px 16px 48px; }
  .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .hero { background: #0F2E26; color: #fff; box-shadow: inset 0 0 0 1px #C9A24D; border-radius: 16px; padding: 24px 32px; display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #E8D5A8; }
  h1 { margin: 0; font-family: 'AC Nord Display', 'Open Sans', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 0 15px rgba(15,46,38,.12); display: flex; flex-direction: column; gap: 14px; }
  .h2 { font-size: 20px; line-height: 28px; font-weight: 700; }
  .small { font-size: 14px; color: #444; line-height: 20px; }
  .label { font-size: 14px; font-weight: 600; }

  .input, select, textarea { font: inherit; font-size: 16px; padding: 10px 14px; border: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px #A3A4A6; outline-color: #1F4D3A; background: #fff; width: 100%; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .input { flex: 1; min-width: 160px; }

  .btn { font: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 24px; padding: 10px 24px; cursor: pointer; background: #1F4D3A; color: #fff; }
  .btn:hover { background: #14382A; }
  .btn:disabled { background: #C9CACC; cursor: not-allowed; }
  .btn.outline { background: #fff; color: #1F4D3A; box-shadow: inset 0 0 0 2px #1F4D3A; }
  .btn.outline:hover { background: #E7EFE9; }
  .btn.spin { font-size: 22px; padding: 14px 48px; background: #8A1C2B; }
  .btn.spin:hover { background: #6E1522; }
  .btn.spin:disabled { background: #C9CACC; }

  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  canvas { width: 100%; max-width: 560px; height: auto; aspect-ratio: 1; }

  .winner { width: 100%; text-align: center; background: #0F2E26; color: #E8D5A8; border-radius: 16px; padding: 16px; box-shadow: inset 0 0 0 1px #C9A24D; }
  .winner .t { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .winner .n { font-family: 'AC Nord Display', 'Open Sans', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.15; color: #fff; word-break: break-word; }

  .names { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  .names li { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 8px; background: #F6F4F0; font-size: 15px; }
  .names li.win { background: #E8D5A8; font-weight: 700; }
  .x { font: inherit; border: 0; background: none; cursor: pointer; color: #8A1C2B; font-size: 18px; line-height: 1; padding: 0 4px; }
  .winners { margin: 0; padding-left: 20px; font-size: 15px; line-height: 24px; }
  .msg { font-size: 14px; line-height: 20px; border-radius: 8px; padding: 8px 12px; background: #EDF5EE; }
  .msg.err { background: #FBE9EA; color: #6E1522; }
  [hidden] { display: none !important; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="page"><div class="wrap">

  <div class="hero">
    <div class="eyebrow">Ops Mod Crew - Holiday Showdown</div>
    <h1>Prize Wheel</h1>
  </div>

  <div class="grid">

    <!-- ===== WHEEL ===== -->
    <div class="card">
      <div class="wheel-wrap">
        <canvas id="wheel" width="1120" height="1120" aria-label="Prize wheel"></canvas>
        <button id="spin" class="btn spin" type="button" disabled>SPIN</button>
        <div id="winner" class="winner" hidden>
          <div class="t">Winner</div>
          <div class="n" id="winnerName"></div>
        </div>
      </div>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div class="stack" style="display:flex;flex-direction:column;gap:16px">

      <div class="card">
        <div class="h2">Load names</div>
        <div class="small">Enter the passcode to pull everyone who RSVP'd as attending from your sheet. Each person appears once.</div>
        <div class="row">
          <input id="key" class="input" type="password" placeholder="Passcode" autocomplete="off">
          <button id="load" class="btn" type="button">Load names</button>
        </div>
        <label class="label">Who goes on the wheel?
          <select id="filter" style="margin-top:4px">
            <option value="all">Everyone attending</option>
            <option value="dinner">Dinner guests only</option>
            <option value="activity">Team building only</option>
          </select>
        </label>
        <div id="status" class="msg" hidden></div>
      </div>

      <div class="card">
        <div class="h2">On the wheel (<span id="count">0</span>)</div>
        <label class="chk"><input id="removeWinner" type="checkbox" checked> Take winners off the wheel</label>
        <ul id="names" class="names"></ul>
        <div class="label">Add names by hand (one per line)</div>
        <textarea id="manual" rows="3" placeholder="Walk-ins, or paste a list if loading doesn't work"></textarea>
        <div class="row">
          <button id="add" class="btn outline" type="button">Add to wheel</button>
          <button id="reset" class="btn outline" type="button">Reset</button>
        </div>
      </div>

      <div class="card" id="winnersCard" hidden>
        <div class="h2">Winners so far</div>
        <ol id="winnersList" class="winners"></ol>
      </div>

    </div>
  </div>

</div></div>

<script>
/* ============================================================
   SETTINGS
   ============================================================ */
// Same Apps Script web app address as the invite page
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzCGh5uH-UDgmTplHWFp8SyXTFjq7blUpLQ4S5krMleeBdJ3GvfTdhQB49fW46QVG2qNw/exec';
const COLORS = [
  ['#1F4D3A', '#E8D5A8'], ['#C9A24D', '#0F2E26'], ['#8A1C2B', '#FFFFFF'],
  ['#0F2E26', '#E8D5A8'], ['#E8D5A8', '#0F2E26'], ['#2F6B52', '#FFFFFF']
];
const SPIN_MS = 5500;

/* ============================================================ */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const canvas = $('wheel'), ctx = canvas.getContext('2d');

let people = [];      // [{name, choice}] as loaded from the sheet
let names = [];       // what's currently on the wheel
let winners = [];
let angle = 0;        // current rotation in radians
let spinning = false;
let lastWinner = null; // name waiting to be taken off at the next spin

function rand(n) {  // fair random integer in [0, n)
  const buf = new Uint32Array(1);
  const max = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(buf); } while (buf[0] >= max);
  return buf[0] % n;
}
function randFloat() { return rand(1000000) / 1000000; }

/* ---------- Drawing ---------- */
function draw() {
  const W = canvas.width, c = W / 2, R = c - 56;
  ctx.clearRect(0, 0, W, W);
  const n = names.length;

  // outer ring
  ctx.beginPath(); ctx.arc(c, c, R + 18, 0, TAU); ctx.fillStyle = '#0F2E26'; ctx.fill();
  ctx.beginPath(); ctx.arc(c, c, R + 18, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = '#C9A24D'; ctx.stroke();

  if (n === 0) {
    ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.fillStyle = '#F6F4F0'; ctx.fill();
    ctx.fillStyle = '#1F4D3A'; ctx.font = '700 44px "Open Sans", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Load names to begin', c, c);
  } else {
    const slice = TAU / n;
    const fontPx = Math.max(18, Math.min(46, Math.floor((R * slice) * 0.55)));
    for (let i = 0; i < n; i++) {
      const a0 = angle + i * slice, a1 = a0 + slice;
      const [bg, fg] = COLORS[i % COLORS.length];
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a1); ctx.closePath();
      ctx.fillStyle = (n > 1 && i === n - 1 && n % COLORS.length === 1) ? COLORS[2][0] : bg;  // avoid same colour touching at the seam
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();

      ctx.save();
      ctx.translate(c, c); ctx.rotate(a0 + slice / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = (n > 1 && i === n - 1 && n % COLORS.length === 1) ? COLORS[2][1] : fg;
      ctx.font = `700 ${fontPx}px "Open Sans", sans-serif`;
      let label = names[i];
      const maxW = R - 90;
      while (ctx.measureText(label).width > maxW && label.length > 3) label = label.slice(0, -2);
      if (label !== names[i]) label = label.trimEnd() + '\u2026';
      ctx.fillText(label, R - 24, 0);
      ctx.restore();
    }
  }

  // hub
  ctx.beginPath(); ctx.arc(c, c, 46, 0, TAU); ctx.fillStyle = '#0F2E26'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#C9A24D'; ctx.stroke();

  // pointer at the top
  ctx.beginPath();
  ctx.moveTo(c - 30, 4); ctx.lineTo(c + 30, 4); ctx.lineTo(c, 76); ctx.closePath();
  ctx.fillStyle = '#8A1C2B'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
}

/* ---------- List UI ---------- */
function renderList() {
  $('count').textContent = names.length;
  const ul = $('names'); ul.innerHTML = '';
  names.forEach((nm, i) => {
    const li = document.createElement('li');
    if (nm === lastWinner) li.className = 'win';
    const span = document.createElement('span'); span.textContent = nm;
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.title = 'Remove'; x.textContent = '\u00D7';
    x.onclick = () => { if (spinning) return; names.splice(i, 1); refresh(); };
    li.appendChild(span); li.appendChild(x); ul.appendChild(li);
  });
  $('spin').disabled = spinning || names.length < 2;
}
function refresh() { renderList(); draw(); }

function setStatus(text, err) {
  const s = $('status');
  if (!text) { s.hidden = true; return; }
  s.textContent = text; s.className = 'msg' + (err ? ' err' : ''); s.hidden = false;
}

/* ---------- Loading names ---------- */
function applyFilter() {
  const f = $('filter').value;
  const keep = p => f === 'all' ? true
    : f === 'dinner' ? (p.choice === 'both' || p.choice === 'dinner')
    : (p.choice === 'both' || p.choice === 'activity');
  names = people.filter(keep).map(p => p.name).sort((a, b) => a.localeCompare(b));
  winners = []; lastWinner = null;
  $('winner').hidden = true; $('winnersCard').hidden = true; $('winnersList').innerHTML = '';
  refresh();
}

async function loadNames() {
  const key = $('key').value;
  if (!key) { setStatus('Enter the passcode first.', true); return; }
  $('load').disabled = true; $('load').textContent = 'Loading...';
  try {
    const r = await fetch(ENDPOINT + '?action=names&key=' + encodeURIComponent(key));
    const d = await r.json();
    if (!d.ok) { setStatus('That passcode didn\u2019t work.', true); }
    else {
      people = d.people || [];
      applyFilter();
      setStatus(people.length ? 'Loaded ' + people.length + ' people from your sheet.' : 'No attending RSVPs found yet.', !people.length);
    }
  } catch (e) {
    setStatus('Couldn\u2019t load names. You can add them by hand below instead.', true);
  }
  $('load').disabled = false; $('load').textContent = 'Load names';
}

/* ---------- Spinning ---------- */
function spin() {
  if (spinning) return;
  // take the previous winner off the wheel now, if that option is on
  if (lastWinner !== null && $('removeWinner').checked) {
    const i = names.indexOf(lastWinner);
    if (i >= 0) names.splice(i, 1);
  }
  lastWinner = null;
  if (names.length < 2) { refresh(); return; }

  spinning = true; $('winner').hidden = true;
  const n = names.length, slice = TAU / n;
  const idx = rand(n);                                   // winner chosen up front, fairly
  const within = 0.15 + 0.7 * randFloat();               // land inside the slice, not on a seam
  const tFinal = idx * slice + slice * within;
  const target = -Math.PI / 2 - tFinal;
  const extra = TAU * (5 + rand(3));
  const start = angle;
  const delta = (((target - start) % TAU) + TAU) % TAU + extra;
  const t0 = performance.now();
  renderList();

  (function frame(now) {
    const p = Math.min(1, (now - t0) / SPIN_MS);
    const ease = 1 - Math.pow(1 - p, 4);
    angle = start + delta * ease;
    draw();
    if (p < 1) { requestAnimationFrame(frame); return; }
    angle = ((angle % TAU) + TAU) % TAU;
    spinning = false;
    lastWinner = names[idx];
    winners.push(lastWinner);
    $('winnerName').textContent = lastWinner; $('winner').hidden = false;
    const li = document.createElement('li'); li.textContent = lastWinner; $('winnersList').appendChild(li);
    $('winnersCard').hidden = false;
    renderList();
  })(t0);
}

/* ---------- Wiring ---------- */
$('load').addEventListener('click', loadNames);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') loadNames(); });
$('filter').addEventListener('change', () => { if (people.length) applyFilter(); });
$('spin').addEventListener('click', spin);
$('add').addEventListener('click', () => {
  const have = new Set(names.map(n => n.toLowerCase()));
  $('manual').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(nm => {
    if (!have.has(nm.toLowerCase())) { names.push(nm); have.add(nm.toLowerCase()); }
  });
  $('manual').value = '';
  refresh();
});
$('reset').addEventListener('click', () => {
  if (spinning) return;
  winners = []; lastWinner = null;
  $('winner').hidden = true; $('winnersCard').hidden = true; $('winnersList').innerHTML = '';
  if (people.length) applyFilter(); else { names = []; refresh(); }
});

refresh();
</script>
</body>
</html>
